# Reverse proxy + load balancer (the "REVERSE PROXY / load balancer" box in the infrastructure diagram)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream clinic_app {
  # round-robin between the two Node instances; Socket.IO uses WebSocket only,
  # so no sticky sessions are needed (JWT is stateless, events travel through Redis pub/sub)
  server app1:3000;
  server app2:3000;
}

server {
  listen 80;
  location / {
    proxy_pass http://clinic_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
}
